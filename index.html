<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arietta · Game Packs</title>
<meta name="description" content="Browse and download game packs for Arietta, the third-party launcher.">
<style>
  :root {
    color-scheme: dark;
    --bg: #0e0e12;
    --card: #1a1a21;
    --card-hover: #1f1f27;
    --border: #2b2b34;
    --accent: #5b5be0;
    --accent-soft: rgba(91, 91, 224, .14);
    --text: #ececf0;
    --muted: #9a9aa4;
    --faint: #6c6c76;
  }
  * { box-sizing: border-box; }
  ::selection { background: rgba(91, 91, 224, .45); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  body {
    margin: 0; padding: 56px 20px 40px;
    background:
      radial-gradient(700px 340px at 50% -100px, rgba(91, 91, 224, .14), transparent 70%),
      radial-gradient(1000px 600px at 92% 120%, rgba(138, 91, 224, .07), transparent 70%)
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font: 14px/1.6 "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", "PingFang SC", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 820px; margin: 0 auto; }

  /* header */
  header { margin-bottom: 6px; }
  header h1 { font-size: 24px; margin: 0; letter-spacing: .3px; }
  .brand {
    background: linear-gradient(90deg, #9a9aff, #c07fff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header h1 small { color: var(--muted); font-weight: 400; font-size: 15px; margin-left: 8px; }
  .tagline { color: var(--muted); font-size: 13px; margin: 0 0 22px; }

  /* language pills */
  .langbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
  .langbar button {
    padding: 5px 14px; border-radius: 20px; cursor: pointer; font-size: 12.5px;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-family: inherit;
  }
  .langbar button:hover { color: var(--text); border-color: #3d3d48; }
  .langbar button.on {
    background: linear-gradient(135deg, rgba(91, 91, 224, .28), rgba(138, 91, 224, .16));
    border-color: var(--accent); color: #cfcfff;
  }

  /* pack cards */
  .card {
    display: flex; gap: 16px; align-items: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 20px; margin-bottom: 14px;
    animation: rise .45s cubic-bezier(.2, .7, .3, 1) backwards;
    transition: border-color .15s, transform .15s, background .15s, box-shadow .15s;
  }
  .card:hover {
    border-color: #3d3d48; background: var(--card-hover); transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(0, 0, 0, .35);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .card:hover, a.btn:hover { transform: none; }
  }
  .avatar {
    width: 52px; height: 52px; border-radius: 12px; flex: none;
    display: grid; place-items: center;
    font-size: 22px; font-weight: 600; color: #fff;
  }
  .avatar-img {
    width: 52px; height: 52px; border-radius: 12px; flex: none;
    object-fit: cover; background: #23232b;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .07);
  }
  .card .info { flex: 1; min-width: 0; }
  .card h2 { font-size: 16px; margin: 0 0 3px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ver {
    font-size: 11px; font-weight: 500; padding: 1px 9px; border-radius: 20px;
    background: var(--accent-soft); color: #c9c9ff;
  }
  .card .meta { color: var(--muted); font-size: 12px; }
  .caps { margin-top: 9px; display: flex; flex-wrap: wrap; gap: 6px; }
  .cap {
    font-size: 11px; padding: 2px 10px; border-radius: 20px;
    background: #23232b; border: 1px solid #33333d; color: #b8b8c0;
  }
  .actions { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  a.btn {
    display: inline-block; padding: 9px 20px; border-radius: 20px; text-decoration: none;
    background: linear-gradient(135deg, #6a6aec, #5b5be0); color: #fff; font-size: 13px; white-space: nowrap;
    box-shadow: 0 2px 14px rgba(91, 91, 224, .35);
    transition: transform .15s, box-shadow .15s, background .15s;
  }
  a.btn:hover {
    background: linear-gradient(135deg, #7676f0, #6c6ce8);
    transform: translateY(-1px);
    box-shadow: 0 4px 18px rgba(91, 91, 224, .5);
  }
  a.btn:active { transform: translateY(0); box-shadow: 0 2px 10px rgba(91, 91, 224, .35); }
  a.repo { color: #8f8fe8; font-size: 12px; text-decoration: none; }
  a.repo:hover { text-decoration: underline; }

  /* note + footer */
  .note {
    background: #15151b; border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 6px 14px 14px 6px;
    padding: 15px 18px; color: var(--muted); font-size: 13px; margin-top: 26px;
  }
  .note code { background: #23232b; padding: 1px 6px; border-radius: 4px; color: #c9c9ff; }
  footer { color: var(--faint); font-size: 12px; margin-top: 26px; }
  footer a { color: var(--faint); }
  #err { color: #e07070; }
  @media (max-width: 560px) {
    .card { flex-direction: column; align-items: flex-start; }
    .actions { flex-direction: row; width: 100%; justify-content: space-between; align-items: center; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="brand">Arietta</span> <small data-i18n="title">Game Packs</small></h1>
  </header>
  <p class="tagline" data-i18n="tagline"></p>
  <div class="langbar" id="langbar"></div>
  <div id="count" class="tagline" style="margin-bottom:14px"></div>
  <div id="packs"></div>
  <p id="err"></p>
  <div class="note" data-i18n="note"></div>
  <footer>
    <span data-i18n="footer"></span>
    <a href="./index.json">index.json</a> ·
    <a href="https://github.com/PaperKito/Arietta" target="_blank" rel="noopener">GitHub</a>
  </footer>
</div>

<script>
const I18N = {
  "en": {
    title: "Game Packs",
    tagline: "Extend Arietta with community-built game packs — install, update, play.",
    download: "Download zip",
    source: "Source",
    author: "Author",
    packs: (n) => `${n} pack${n === 1 ? "" : "s"} available`,
    note: `Install from inside Arietta: open <code>Settings → Game packs</code> — it reads this index and verifies every pack's sha256 and author signature before installing. You can also download the zip here and extract it to <code>&lt;data folder&gt;/games/&lt;pack id&gt;/</code> yourself.`,
    footer: "Static index hosted on GitHub Pages · metadata only, packs live in their own repos' Releases.",
    err: "Failed to load index: ",
  },
  "zh-Hans": {
    title: "游戏包",
    tagline: "用社区制作的游戏包扩展 Arietta —— 在线安装、一键更新。",
    download: "下载 zip",
    source: "源码",
    author: "作者",
    packs: (n) => `共 ${n} 个游戏包`,
    note: `在 Arietta 内安装：打开 <code>设置 → 游戏包</code>，宿主会读取本索引，校验每个包的 sha256 与作者签名后才安装。也可以在这里直接下载 zip，手动解压到 <code>&lt;数据目录&gt;/games/&lt;包 id&gt;/</code>。`,
    footer: "静态索引由 GitHub Pages 托管 · 只存元数据，包文件在各自仓库的 Release。",
    err: "索引加载失败：",
  },
  "zh-Hant": {
    title: "遊戲包",
    tagline: "用社群製作的遊戲包擴充 Arietta —— 線上安裝、一鍵更新。",
    download: "下載 zip",
    source: "原始碼",
    author: "作者",
    packs: (n) => `共 ${n} 個遊戲包`,
    note: `在 Arietta 內安裝：開啟 <code>設定 → 遊戲包</code>，宿主會讀取本索引，校驗每個包的 sha256 與作者簽章後才安裝。也可以在這裡直接下載 zip，手動解壓到 <code>&lt;資料目錄&gt;/games/&lt;包 id&gt;/</code>。`,
    footer: "靜態索引由 GitHub Pages 託管 · 只存元數據，包檔案在各自倉庫的 Release。",
    err: "索引載入失敗：",
  },
  "ja": {
    title: "ゲームパック",
    tagline: "コミュニティ製のゲームパックで Arietta を拡張 —— オンラインインストール、ワンクリック更新。",
    download: "zip をダウンロード",
    source: "ソース",
    author: "作者",
    packs: (n) => `全 ${n} 個のパック`,
    note: `Arietta からのインストール：<code>設定 → ゲームパック</code> を開くと、ホストがこのインデックスを読み込み、各パックの sha256 と作者の署名を検証してからインストールします。ここで zip をダウンロードし、<code>&lt;データフォルダ&gt;/games/&lt;パック ID&gt;/</code> に手動で展開することもできます。`,
    footer: "静的インデックスは GitHub Pages でホスト · メタデータのみ、パック本体は各リポジトリの Release。",
    err: "インデックスの読み込みに失敗：",
  },
  "ko": {
    title: "게임 팩",
    tagline: "커뮤니티가 만든 게임 팩으로 Arietta를 확장하세요 — 온라인 설치, 원클릭 업데이트.",
    download: "zip 다운로드",
    source: "소스",
    author: "제작자",
    packs: (n) => `총 ${n}개의 팩`,
    note: `Arietta에서 설치: <code>설정 → 게임 팩</code>을 열면 호스트가 이 색인을 읽고 각 팩의 sha256과 작성자 서명을 검증한 뒤 설치합니다. 여기서 zip을 내려받아 <code>&lt;데이터 폴더&gt;/games/&lt;팩 id&gt;/</code>에 직접 압축 해제할 수도 있습니다.`,
    footer: "정적 색인은 GitHub Pages에서 호스팅 · 메타데이터만 저장, 팩 파일은 각 저장소의 Release.",
    err: "색인 로드 실패: ",
  },
};

const LANGS = [["en", "English"], ["zh-Hans", "简体中文"], ["zh-Hant", "繁體中文"], ["ja", "日本語"], ["ko", "한국어"]];
const CAP_LABELS = {
  launch:            { en: "Launch", "zh-Hans": "启动", "zh-Hant": "啟動", ja: "起動", ko: "실행" },
  gacha:             { en: "Gacha log", "zh-Hans": "抽卡", "zh-Hant": "抽卡", ja: "ガチャ", ko: "가챠" },
  settings:          { en: "Settings", "zh-Hans": "设置", "zh-Hant": "設定", ja: "設定", ko: "설정" },
  community:         { en: "Community", "zh-Hans": "社区", "zh-Hant": "社區", ja: "コミュニティ", ko: "커뮤니티" },
  communityAutoSign: { en: "Auto sign-in", "zh-Hans": "自动签到", "zh-Hant": "自動簽到", ja: "自動チェックイン", ko: "자동 출석" },
  accounts:          { en: "Accounts", "zh-Hans": "账号", "zh-Hant": "帳號", ja: "アカウント", ko: "계정" },
  update:            { en: "Update", "zh-Hans": "更新", "zh-Hant": "更新", ja: "更新", ko: "업데이트" },
};

// Default English; the user's choice persists in localStorage.
let lang = localStorage.getItem("packs-lang") || "en";
if (!I18N[lang]) lang = "en";
let indexData = null;

const T = (key) => I18N[lang][key] ?? I18N.en[key];

function pickName(names) {
  if (!names) return "";
  return names[lang] || names.en || names["zh-Hans"] || Object.values(names)[0] || "";
}

// Deterministic gradient per pack id, so letter avatars aren't all the same color.
function hueOf(id) {
  let h = 0;
  for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360;
  return h;
}

function capChip(key) {
  const labels = CAP_LABELS[key];
  return `<span class="cap">${(labels && (labels[lang] || labels.en)) || key}</span>`;
}

function renderLangbar() {
  document.getElementById("langbar").innerHTML = LANGS.map(([code, label]) =>
    `<button data-lang="${code}" class="${code === lang ? "on" : ""}">${label}</button>`).join("");
  document.getElementById("langbar").querySelectorAll("button").forEach(b => b.onclick = () => {
    lang = b.dataset.lang;
    localStorage.setItem("packs-lang", lang);
    renderAll();
  });
}

function renderAll() {
  document.documentElement.lang = lang;
  document.title = `Arietta · ${T("title")}`;
  renderLangbar();
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = T(el.dataset.i18n); });
  if (!indexData) return;

  const packs = indexData.packs || [];
  document.getElementById("count").textContent = T("packs")(packs.length);
  document.getElementById("packs").innerHTML = packs.map((p, i) => {
    const name = pickName(p.names) || p.id;
    const hue = hueOf(p.id);
    const chips = Object.entries(p.capabilities || {})
      .filter(([, v]) => v)
      .map(([k]) => capChip(k))
      .join("");
    const avatar = p.icon
      ? `<img class="avatar-img" src="${p.icon}" alt="" loading="lazy">`
      : `<div class="avatar" style="background:linear-gradient(135deg, hsl(${hue} 45% 42%), hsl(${(hue + 40) % 360} 45% 30%))">${(name[0] || "?").toUpperCase()}</div>`;
    return `
    <div class="card" style="animation-delay:${i * 70}ms">
      ${avatar}
      <div class="info">
        <h2>${name} <span class="ver">v${p.version}</span></h2>
        <div class="meta">${T("author")}: ${p.author || "-"}</div>
        <div class="caps">${chips}</div>
      </div>
      <div class="actions">
        <a class="btn" href="${p.download}" rel="noopener">${T("download")}</a>
        ${p.repo ? `<a class="repo" href="${p.repo}" target="_blank" rel="noopener">${T("source")} ↗</a>` : ""}
      </div>
    </div>`;
  }).join("");
}

fetch("./index.json")
  .then(r => r.json())
  .then(data => { indexData = data; renderAll(); })
  .catch(e => { document.getElementById("err").textContent = T("err") + e; });

renderAll();
</script>
</body>
</html>
